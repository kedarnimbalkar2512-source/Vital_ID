# Render blueprint for the FastAPI backend (free web service).
# Secrets are marked sync: false, so Render asks for them in the dashboard; never commit them.
services:
  - type: web
    name: vitalid-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QR_TOKEN_SECRET
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      # Set both to your Netlify site URL (e.g. https://vitalid.netlify.app) once it exists.
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
